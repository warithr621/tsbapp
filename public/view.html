<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View TSB Questions</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-orange-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Logo -->
        <div class="flex justify-end mb-8">
            <a href="index.html" class="hover:opacity-90 transition-opacity">
                <img src="/images/logo.png" alt="Logo" class="w-48 h-auto">
            </a>
        </div>

        <div class="max-w-4xl mx-auto">
            <h1 class="text-5xl md:text-6xl font-bold text-burnt mb-12 text-center">Generate</h1>

            <!-- Step 1: Round selection -->
            <div id="roundForm" class="bg-white rounded-xl shadow-lg p-8 mb-6">
                <div class="mb-6">
                    <label for="round" class="block text-sm font-medium text-gray-700 mb-2">Select Round:</label>
                    <select id="round" name="round" class="w-full rounded-lg border-gray-300 focus:border-burnt focus:ring-burnt/20">
                        <option value="rr1">Round Robin 1</option>
                        <option value="rr2">Round Robin 2</option>
                        <option value="rr3">Round Robin 3</option>
                        <option value="rr4">Round Robin 4</option>
                        <option value="rr5">Round Robin 5</option>
                        <option value="de1">Double Elim 1</option>
                        <option value="de2">Double Elim 2</option>
                        <option value="de3">Double Elim 3</option>
                        <option value="de4">Double Elim 4</option>
                        <option value="de5">Double Elim 5</option>
                        <option value="de6">Double Elim 6</option>
                        <option value="de7">Double Elim 7</option>
                        <option value="f1">Finals 1</option>
                        <option value="f2">Finals 2</option>
                    </select>
                </div>
            </div>

            <!-- Step 2: Per-subject counts + Shuffle -->
            <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
                <h2 class="text-lg font-semibold text-burnt mb-4">Questions per Subject</h2>
                <div id="subjectCountsGrid" class="grid grid-cols-2 gap-4 mb-6"></div>
                <div class="flex justify-end">
                    <button
                        id="shuffleBtn"
                        class="bg-burnt text-white px-8 py-3 rounded-lg font-medium hover:bg-burnt-dark transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-burnt focus:ring-offset-2"
                    >
                        Shuffle
                    </button>
                </div>
            </div>

            <!-- Step 3: Shuffle result + Writers + Generate -->
            <div id="shuffleResult" class="hidden bg-white rounded-xl shadow-lg p-8 mb-6">
                <h2 class="text-lg font-semibold text-burnt mb-2">Subject Order</h2>
                <p id="shuffleOrderDisplay" class="text-gray-800 font-medium mb-6"></p>

                <!-- Writers inputs (populated by JS, canonical subject order) -->
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-gray-700 mb-3">Writers <span class="font-normal text-gray-400">(optional)</span></h3>
                    <div id="writerInputs" class="space-y-2"></div>
                </div>

                <!-- Packet Branding -->
                <div class="mt-6 pt-6 border-t border-gray-100">
                    <h3 class="text-sm font-semibold text-gray-700 mb-4">Packet Branding</h3>

                    <!-- Logo selector -->
                    <div class="mb-4 p-3 rounded-lg" style="background:#fdf6f0;border:1.5px solid #e8d5c4;">
                        <div class="flex items-start gap-4">
                            <img id="logoPreview" src="/images/logo.png" alt="Logo preview"
                                 class="flex-shrink-0 object-contain rounded"
                                 style="height:4rem;width:auto;max-width:8rem;border:1px solid #e5e7eb;background:white;padding:2px;" />
                            <div class="flex-1">
                                <label class="flex items-center gap-2 mb-2 cursor-pointer">
                                    <input type="radio" name="logoOption" value="default" checked style="accent-color:#B25D22;" />
                                    <span class="text-sm text-gray-700">Use current default</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="logoOption" value="upload" style="accent-color:#B25D22;" />
                                    <span class="text-sm text-gray-700">Upload new</span>
                                </label>
                                <div id="logoUploadPanel" class="hidden mt-3 pt-3" style="border-top:1px solid #e8d5c4;">
                                    <input type="file" id="logoFileInput" accept="image/*" class="text-sm text-gray-600 w-full mb-2" />
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" id="saveLogoDefault" style="accent-color:#B25D22;" />
                                        <span class="text-sm text-gray-500">Save as new default</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tournament name + Edition -->
                    <div style="display:grid;grid-template-columns:8rem 1fr;row-gap:0.5rem;column-gap:0.75rem;align-items:start;">
                        <label class="text-sm font-semibold text-gray-700 pt-1">Tournament</label>
                        <input id="tournamentName" type="text" value="Texas Science Bowl Invitational"
                            style="width:100%;border:2px solid #B25D22;border-radius:0;padding:0.375rem 0.625rem;font-size:0.875rem;outline:none;" />

                        <label class="text-sm font-semibold text-gray-700 pt-1">Edition</label>
                        <div>
                            <input id="edition" type="text" placeholder="e.g. Spring 2026"
                                style="width:100%;border:2px solid #B25D22;border-radius:0;padding:0.375rem 0.625rem;font-size:0.875rem;outline:none;" />
                            <p id="editionError" class="hidden text-xs mt-1" style="color:#dc2626;">Edition is required.</p>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-4 mt-6">
                    <button
                        id="rerollBtn"
                        class="bg-white text-burnt border-2 border-burnt px-8 py-3 rounded-lg font-medium hover:bg-orange-50 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-burnt focus:ring-offset-2"
                    >
                        Re-roll
                    </button>
                    <button
                        id="generateBtn"
                        class="bg-burnt text-white px-8 py-3 rounded-lg font-medium hover:bg-burnt-dark transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-burnt focus:ring-offset-2"
                    >
                        Generate
                    </button>
                </div>
            </div>

            <!-- Step 4: Download buttons (2x2 grid: tex + pdf per column) -->
            <div id="outputButtons" class="hidden bg-white rounded-xl shadow-lg p-8 mb-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-base font-semibold text-burnt mb-3">Round Packet</h3>
                        <div class="space-y-3">
                            <button
                                id="downloadRoundTexBtn"
                                class="w-full bg-burnt text-white px-6 h-11 flex items-center justify-center rounded-lg font-medium hover:bg-burnt-dark transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-burnt focus:ring-offset-2"
                            >
                                Download .tex
                            </button>
                            <div id="roundPdfArea"></div>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-base font-semibold text-burnt mb-3">Replacements</h3>
                        <div class="space-y-3">
                            <button
                                id="downloadReplacementsTexBtn"
                                class="w-full bg-burnt text-white px-6 h-11 flex items-center justify-center rounded-lg font-medium hover:bg-burnt-dark transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-burnt focus:ring-offset-2"
                            >
                                Download .tex
                            </button>
                            <div id="replacementsPdfArea"></div>
                        </div>
                    </div>
                </div>
                <div id="pdfErrors" class="hidden mt-6 p-4 bg-red-50 rounded-lg border border-red-200 text-sm text-red-800"></div>
            </div>
        </div>
    </div>

    <script src="/js/rounds.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/view.js"></script>
</body>
</html>
