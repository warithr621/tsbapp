<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TSB App Home Page</title>
	<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-orange-100 min-h-screen flex flex-col">
	<div class="container mx-auto px-4 py-8 flex-1 flex flex-col justify-center items-center">
		<!-- Logo -->
		<div class="flex justify-end w-full mb-8">
			<img src="/images/logo.png" alt="Logo" class="w-48 h-auto transition-transform hover:scale-105">
		</div>
		
		<!-- Main Content -->
		<div class="flex flex-col items-center justify-center w-full flex-1">
			<div class="text-center mb-10">
				<h1 class="text-5xl font-bold text-burnt mb-2">Science Bowl Packet Compiler</h1>
				<p class="text-gray-500 text-lg">Brought to you by <u><a href="https://texassciencebowl.org" target="_blank" rel="noopener noreferrer" class="text-burnt hover:underline font-medium">Texas Science Bowl</a></u></p>
			</div>
			<div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl">
				<button 
					id="uploadQuestion" 
					class="bg-white p-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 text-burnt hover:bg-burnt hover:text-white text-4xl md:text-5xl font-bold"
				>
					Upload Questions
				</button>
				<button 
					id="viewQuestions" 
					class="bg-white p-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 text-burnt hover:bg-burnt hover:text-white text-4xl md:text-5xl font-bold"
				>
					View Questions
				</button>
				<button 
					id="resetQuestions" 
					class="bg-white p-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 text-burnt hover:bg-burnt hover:text-white text-4xl md:text-5xl font-bold"
				>
					Reset All Questions
				</button>
	</div>
		</div>
	</div>
	<script src="/js/home.js"></script>
</body>
</html>
